# Prometheus 抓取配置 —— 稳定性验收看板数据源。
# 生产验收默认抓生产 Nginx HTTPS 域名，避免公网 8080 被云防火墙阻断。
global:
  scrape_interval: 5s        # 验收期要看曲线即时变化，抓密一点
  evaluation_interval: 15s

# 错误告警规则（基于 sub2api_ops_error_total）。firing 的告警推给 Alertmanager
# 走邮件通知（见 alertmanager.yml），同时仍可在 Prometheus /alerts 页面查看。
rule_files:
  - /etc/prometheus/prometheus.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["sub2api-alertmanager:9093"]

scrape_configs:
  - job_name: sub2api-backend
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["napi.metask-ai.com"]
        labels:
          service: sub2api
          env: prod
    # 生产 /metrics 需要 Bearer Token（无 token 直接 401）。token 明文单行放在
    # gitignored 的 observability/bearer_token.txt，由 compose bind-mount 进容器；
    # 新环境要先自己建这个文件，否则 Prometheus 起不来。
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/bearer_token.txt
    # 不设 tls_config：napi.metask-ai.com 用的是公网可信证书，走默认校验即可。

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
