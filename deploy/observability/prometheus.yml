# Prometheus 抓取配置 —— 稳定性验收看板数据源。
# 生产验收默认抓生产 Nginx HTTPS 域名，避免公网 8080 被云防火墙阻断。
global:
  scrape_interval: 5s        # 验收期要看曲线即时变化，抓密一点
  evaluation_interval: 15s

# 错误告警规则（基于 sub2api_ops_error_total）。本地未接 Alertmanager 时，
# firing 状态仍会在 Prometheus /alerts 页面显示。
rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  - job_name: sub2api-backend
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["napi.metask-ai.com"]
        labels:
          service: sub2api
          env: prod

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
