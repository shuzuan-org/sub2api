apiVersion: 1

datasources:
  # Prometheus —— 低基数聚合指标（趋势 / SLO / 告警面板）。
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://sub2api-prometheus:9090
    isDefault: true
    editable: true

  # sub2api-pg —— 只读连 ops_error_logs，供错误看板做高基数逐请求下钻。
  # 本地走同一 docker 网络的 postgres 容器（服务名 postgres）；连接参数由 compose
  # 注入的环境变量提供（见 docker-compose.observability.yml 的 grafana.environment）。
  # 生产环境应指向只读账号 grafana_ro（仅 GRANT SELECT ON ops_error_logs）。
  - name: sub2api-pg
    type: postgres
    uid: sub2api-pg
    access: proxy
    url: $PG_HOST:$PG_PORT
    user: $PG_RO_USER
    secureJsonData:
      password: $PG_RO_PASSWORD
    jsonData:
      database: $PG_DATABASE
      sslmode: $PG_SSLMODE
      postgresVersion: 1500
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      timescaledb: false
    editable: true
