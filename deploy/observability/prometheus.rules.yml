# sub2api 错误告警规则
#
# 数据源：sub2api_ops_error_total（与 ops_error_logs 同源的错误聚合计数）+
#         sub2api_http_requests_total（总请求，算比率用）。
# 阈值均为保守默认，可按实际流量/SLO 调整；每条注明依据。
# 触发后经 Alertmanager 路由（本地未接 Alertmanager 时，规则仍会在 Prometheus /alerts 显示 firing）。
#
# annotation 里的 dashboard 链接指向"Sub2api 错误分析与排障"看板，便于从告警跳到下钻。

groups:
  - name: sub2api-errors
    rules:
      # 内部错误（phase=internal 是我们自己的 bug/未预期异常）——最高优先。
      # 依据：健康服务内部错误率应趋近 0；持续 >0.05 req/s 说明有代码/依赖故障。
      - alert: Sub2apiInternalErrorSpike
        expr: sum(rate(sub2api_ops_error_total{phase="internal"}[5m])) > 0.05
        for: 10m
        labels:
          severity: page
          service: sub2api
        annotations:
          summary: "sub2api 内部错误持续升高（phase=internal）"
          description: "近 5m 内部错误率 {{ printf \"%.3f\" $value }} req/s，持续 10m 超过 0.05。多为代码 bug 或核心依赖（DB/Redis）故障。"
          dashboard: "Grafana → Sub2api 错误分析与排障（by phase 面板，选 phase=internal）"

      # P1 错误占比过高（按比例而非"出现即报"）。
      # 依据：P1 = 单请求 5xx 或 429（classifyOpsSeverity），逐条判定，零星出现属常态；
      #       占总请求 >5% 持续 5m 才视为事故。附加 5m 内至少 5 条，避免低谷期 1/3 这种小样本误报。
      #       用户级排队/并发满已归为 P3 + business_limited，不会进入本规则。
      - alert: Sub2apiP1ErrorsPresent
        expr: |
          sum(rate(sub2api_ops_error_total{severity="P1"}[5m]))
            / clamp_min(sum(rate(sub2api_http_requests_total[5m])), 1e-9) > 0.05
          and sum(increase(sub2api_ops_error_total{severity="P1"}[5m])) >= 5
        for: 5m
        labels:
          severity: page
          service: sub2api
        annotations:
          summary: "sub2api P1 错误占比超过 5%"
          description: "近 5m P1 错误占总请求 {{ $value | humanizePercentage }}，持续 5m。"
          dashboard: "Grafana → Sub2api 错误分析与排障（by severity / 未解决 P1 表）"

      # 真实错误率（排除业务限制）过高。
      # 依据：business_limited=true 为额度/并发/计费等预期拦截，不应触发可用性告警；
      #       其余错误占总请求 >2% 持续 10m 视为服务质量劣化。
      - alert: Sub2apiHighRealErrorRatio
        expr: |
          sum(rate(sub2api_ops_error_total{business_limited="false"}[5m]))
            / clamp_min(sum(rate(sub2api_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "sub2api 真实错误率超过 2%"
          description: "近 5m 真实错误率（排除业务限制）{{ $value | humanizePercentage }}，持续 10m。"
          dashboard: "Grafana → Sub2api 错误分析与排障（真实错误率 / by type）"

      # 单个上游平台劣化（upstream 阶段错误按 platform 拆分）。
      # 依据：某平台 upstream 阶段真实错误 >0.1 req/s 持续 10m，通常是该上游/账号池不稳。
      - alert: Sub2apiUpstreamPlatformDegraded
        expr: sum by (platform) (rate(sub2api_ops_error_total{phase="upstream", business_limited="false"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "sub2api 上游平台 {{ $labels.platform }} 错误升高"
          description: "平台 {{ $labels.platform }} 近 5m upstream 阶段真实错误率 {{ printf \"%.3f\" $value }} req/s，持续 10m。"
          dashboard: "Grafana → Sub2api 错误分析与排障（by platform，Top 上游状态码表）"

      # 鉴权阶段错误突增（批量 token 过期 / 凭据失效）。
      # 依据：auth 阶段错误短时突增多为账号 token 集体过期或上游认证策略变化。
      - alert: Sub2apiAuthErrorSpike
        expr: sum(rate(sub2api_ops_error_total{phase="auth"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "sub2api 鉴权阶段错误突增（phase=auth）"
          description: "近 5m auth 阶段错误率 {{ printf \"%.3f\" $value }} req/s，持续 5m。多为账号 token 集体过期/凭据失效。"
          dashboard: "Grafana → Sub2api 错误分析与排障（by phase，选 phase=auth）"

  # 可用性兜底：上面所有基于 rate() 的规则在"抓不到数据"时都会静默，
  # 进程挂掉 / Nginx 挂掉 / bearer token 失效这类最严重的事故必须单独兜住。
  - name: sub2api-availability
    rules:
      # 抓取失败（进程挂、Nginx 挂、域名/证书问题、token 失效 401 都会让 up=0）。
      # 依据：5s 抓一次，持续 2m 失败排除单次网络抖动。
      - alert: Sub2apiDown
        expr: up{job="sub2api-backend"} == 0
        for: 2m
        labels:
          severity: page
          service: sub2api
        annotations:
          summary: "sub2api /metrics 抓取失败（服务不可达）"
          description: "Prometheus 连续 2m 抓不到 {{ $labels.instance }}。先查进程与 Nginx，再查 bearer_token 是否失效（401 同样会触发）。"
          dashboard: "Prometheus → Status → Targets"

      # 能抓到指标但没有任何业务请求（进程活着但不接流量，如 listener 交接异常、入口被挡）。
      # 依据：/metrics 自身不计入 http_requests_total，生产 10m 零请求即视为异常。
      - alert: Sub2apiNoTraffic
        expr: sum(rate(sub2api_http_requests_total[5m])) == 0
        for: 10m
        labels:
          severity: page
          service: sub2api
        annotations:
          summary: "sub2api 持续 10m 无任何业务请求"
          description: "进程可被抓取但 http_requests_total 无增长。检查入口 Nginx/DNS、tableflip 交接后新进程是否接管 listener。"
          dashboard: "Grafana → Sub2api 错误分析与排障（成功率 / 真实错误率）"

  - name: sub2api-model-metrics
    rules:
      # 单个模型上游错误持续升高（比平台级告警更精细）。
      # 依据：某模型 upstream 阶段真实错误 >0.1 req/s 持续 10m，通常是该模型上游不稳。
      - alert: Sub2apiModelUpstreamDegraded
        expr: |
          sum by (platform, model) (
            rate(sub2api_ops_error_total{phase="upstream", business_limited="false"}[10m])
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "模型 {{ $labels.platform }}/{{ $labels.model }} 上游错误升高"
          description: "近 10m upstream 阶段真实错误率 {{ printf \"%.3f\" $value }} req/s，持续 10m。多为该模型上游不稳或账号池问题。"
          dashboard: "Grafana → Sub2api 按模型稳定性"

      # 模型 TTFT 延迟飙升（首 token 时间过长）。
      # 依据：TTFT P95 >30s 持续 15m，该模型上游可能排队严重或过载。
      - alert: Sub2apiModelHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (platform, model, le) (
              rate(sub2api_upstream_latency_seconds_bucket{phase="ttft"}[10m])
            )
          ) > 30
        for: 15m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "模型 {{ $labels.platform }}/{{ $labels.model }} TTFT P95 超过 30s"
          description: "当前 TTFT P95 = {{ printf \"%.1f\" $value }}s。该模型上游可能排队严重或过载。"
          dashboard: "Grafana → Sub2api 按模型稳定性"

      # 模型上游 429 限流频率过高（吞吐瓶颈预警）。
      # 依据：某模型上游 429 >0.05 req/s 持续 10m，账号 RPM 配额可能不足。
      - alert: Sub2apiModelRateLimited
        expr: |
          sum by (platform, model) (
            rate(sub2api_upstream_status_total{upstream_status="429"}[10m])
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "模型 {{ $labels.platform }}/{{ $labels.model }} 上游 429 限流频率升高"
          description: "近 10m 上游 429 率 {{ printf \"%.3f\" $value }} req/s。该模型账号 RPM 配额可能不足，需检查账号池。"
          dashboard: "Grafana → Sub2api 按模型稳定性"

      # 账号池枯竭（单模型无可用账号）。
      # 依据：某模型可用账号不足总数 20% 持续 5m，需要紧急补充。
      # 口径：total 只含"计划内"账号（active 且 schedulable=true，人为下线不计入），
      #       故本告警只反映故障性不可用（限流/过载/临时封禁/账号 error）。
      - alert: Sub2apiModelAccountPoolExhausted
        expr: |
          sub2api_account_pool_available
            / clamp_min(sub2api_account_pool_total, 1) < 0.2
        for: 5m
        labels:
          severity: page
          service: sub2api
        annotations:
          summary: "模型 {{ $labels.platform }}/{{ $labels.model }} 可用账号不足 20%"
          description: "当前可用账号占比 = {{ $value | humanizePercentage }}（具体个数见 sub2api_account_pool_available / _total）。急需补充账号或解除封禁。"
          dashboard: "Grafana → Sub2api 按模型稳定性"

      # 上游 5xx 错误率升高（上游服务端故障）。
      # 依据：某模型上游 5xx >0.05 req/s 持续 5m。
      - alert: Sub2apiModelUpstream5xx
        expr: |
          sum by (platform, model) (
            rate(sub2api_upstream_status_total{upstream_status=~"5.."}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "模型 {{ $labels.platform }}/{{ $labels.model }} 上游 5xx 错误率升高"
          description: "近 5m 上游 5xx 率 {{ printf \"%.3f\" $value }} req/s。该模型上游服务可能故障。"
          dashboard: "Grafana → Sub2api 按模型稳定性"

      # 上游客户端缓存即将打满（资源预警）。
      # 依据：每个账号/代理一个 HTTP 客户端，缓存数达到 gateway.max_upstream_clients 后
      #       新账号的请求直接失败（upstream client cache limit reached）。>80% 持续 10m 预警。
      # 注：单客户端的连接上限在 account/account_proxy 隔离下等于账号并发，
      #     那由调度器与 Sub2apiModelAccountPoolExhausted 覆盖，这里不重复。
      - alert: Sub2apiUpstreamPoolSaturated
        expr: |
          sub2api_upstream_pool_clients_cached
            / sub2api_upstream_pool_clients_limit > 0.8
          and sub2api_upstream_pool_clients_limit > 0
        for: 10m
        labels:
          severity: warning
          service: sub2api
        annotations:
          summary: "上游客户端缓存占用超过 80%"
          description: "clients_cached / max_upstream_clients = {{ $value | humanizePercentage }}。满了之后新账号请求会直接失败，需调大 gateway.max_upstream_clients 或缩短 gateway.client_idle_ttl_seconds。"
          dashboard: "Grafana → Sub2api 按模型稳定性"
